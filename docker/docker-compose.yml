networks:
  carbon_network:
    driver: bridge

volumes:
  mongo_data:
  postgres_data:

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper_carbon
    networks:
      - carbon_network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_carbon
    networks:
      - carbon_network
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper_carbon:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_carbon:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"

  mongodb:
    image: mongo:6.0
    container_name: mongodb_carbon
    networks:
      - carbon_network
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.0
    container_name: mlflow_carbon
    networks:
      - carbon_network
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0

  pyspark:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: pyspark_carbon
    networks:
      - carbon_network
    user: root
    volumes:
      - ../processing:/app/processing
      - ../myfile.env:/app/myfile.env
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    command: start.sh jupyter lab --NotebookApp.token=''

  postgres:
    image: postgres:13
    container_name: postgres_airflow
    networks:
      - carbon_network
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  airflow-init:
    image: apache/airflow:2.7.0
    container_name: airflow_init
    networks:
      - carbon_network
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../myfile.env:/opt/airflow/myfile.env
    entrypoint: /bin/bash
    command: -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_scheduler
    networks:
      - carbon_network
    depends_on:
      - postgres
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../ingestion:/opt/airflow/ingestion
      - ../ml:/opt/airflow/ml
      - ../processing:/opt/airflow/processing
      - ../myfile.env:/opt/airflow/myfile.env
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    restart: always

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_webserver
    networks:
      - carbon_network
    depends_on:
      - postgres
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../ingestion:/opt/airflow/ingestion
      - ../ml:/opt/airflow/ml
      - ../processing:/opt/airflow/processing
      - ../myfile.env:/opt/airflow/myfile.env
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8090:8080"
    command: webserver
    restart: always